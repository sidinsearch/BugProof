name: BugProof Capture
description: Capture a failing command as a .bug artifact in CI

inputs:
  command:
    description: Command to capture (e.g. 'npm test' or './ci.sh')
    required: true
  name:
    description: Artifact name (defaults to bug_<timestamp>)
    required: false
  timeout:
    description: Command timeout in milliseconds
    required: false
    default: '300000'
  skip-secrets:
    description: Skip environment secret scanning
    required: false
    default: 'false'
  upload-artifact:
    description: Upload .bug file as a GitHub Actions artifact
    required: false
    default: 'true'
  node-version:
    description: Node.js version for bugproof
    required: false
    default: '24'

outputs:
  artifact-path:
    description: Path to the generated .bug artifact
    value: ${{ steps.capture.outputs.artifact-path }}
  exit-code:
    description: Exit code of the captured command
    value: ${{ steps.capture.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    # Cache the global npm install so it's fast on subsequent runs
    - name: Cache bugproof
      id: cache-bugproof
      uses: actions/cache@v4
      with:
        # actions/setup-node installs to ~/.npm-global (not nvm) on runners
        path: ~/.npm-global
        key: bugproof-${{ runner.os }}-node-${{ inputs.node-version }}-v2

    - name: Install bugproof
      if: steps.cache-bugproof.outputs.cache-hit != 'true'
      shell: bash
      run: npm install -g bugproof

    # Use --json for reliable machine-readable output instead of parsing human text
    - name: Capture command
      id: capture
      shell: bash
      env:
        BUGPROOF_COMMAND: ${{ inputs.command }}
        BUGPROOF_NAME: ${{ inputs.name }}
        BUGPROOF_TIMEOUT: ${{ inputs.timeout }}
        BUGPROOF_SKIP_SECRETS: ${{ inputs.skip-secrets }}
      run: |
        NAME_ARG=""
        if [ -n "$BUGPROOF_NAME" ]; then
          NAME_ARG="-n $BUGPROOF_NAME"
        fi
        SECRET_ARG=""
        if [ "$BUGPROOF_SKIP_SECRETS" = "true" ]; then
          SECRET_ARG="--skip-secrets"
        fi

        # --json gives us parseable output; capture stdout and stderr separately
        CAPTURE_OUTPUT=$(bugproof capture $NAME_ARG $SECRET_ARG --timeout $BUGPROOF_TIMEOUT --json -- $BUGPROOF_COMMAND 2>&1)
        EXIT_CODE=$?
        echo "$CAPTURE_OUTPUT"

        # Extract artifact path from JSON output (portable grep - no Perl regex)
        ARTIFACT_PATH=$(echo "$CAPTURE_OUTPUT" | grep -o '"path"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"path"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
        if [ -z "$ARTIFACT_PATH" ]; then
          # Fallback: find the most recent .bug file
          ARTIFACT_PATH=$(find . -maxdepth 2 -name '*.bug' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
        fi
        if [ -z "$ARTIFACT_PATH" ]; then
          ARTIFACT_PATH=$(ls -t *.bug 2>/dev/null | head -1)
        fi
        echo "artifact-path=${ARTIFACT_PATH:-}" >> $GITHUB_OUTPUT
        echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT

    # Clean up .bug files from the workspace after upload
    - name: Upload .bug artifact
      if: ${{ inputs.upload-artifact == 'true' && steps.capture.outputs.artifact-path != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: bugproof-capture-${{ inputs.name || github.sha }}
        path: ${{ steps.capture.outputs.artifact-path }}
        if-no-files-found: warn

    - name: Clean up .bug files
      if: always()
      shell: bash
      run: find . -maxdepth 2 -name '*.bug' -delete 2>/dev/null || true
