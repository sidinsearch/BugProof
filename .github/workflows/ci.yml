name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - 'dummy-project/bugs/**'
      - 'assets/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - 'dummy-project/bugs/**'
      - 'assets/**'

# Prevent concurrent runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for publishing and releases
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

# Environment variables for all jobs
env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  # ========================================
  # Phase 1: Test Matrix (3 OS, single Node LTS)
  # ========================================
  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests with coverage
        run: npm test -- --runInBand --verbose --coverage

      - name: Run linter
        run: npm run lint

      - name: Upload coverage to Codecov (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            coverage/
            logs/
            ~/.npm/_logs/
          retention-days: 7

  # ========================================
  # Phase 2: Security & Package Validation
  # ========================================
  security-audit:
    name: Security Audit & Package
    runs-on: ubuntu-latest
    needs: test-matrix
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate || echo "Audit completed with warnings"

      - name: Check for outdated dependencies
        run: npm outdated || echo "Dependency check completed"

      - name: Create package tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'
          retention-days: 7

  # ========================================
  # Phase 3: Cross-Platform Install Test
  # ========================================
  smoke-install:
    name: Smoke Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: security-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: List downloaded files
        shell: bash
        run: ls -la *.tgz || echo "No tarballs found"

      - name: Create test environment (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke-test
          cd smoke-test
          npm init -y
          # Get the actual tarball name
          TARBALL=$(ls ../*.tgz | head -1)
          echo "Installing tarball: $TARBALL"
          npm install "$TARBALL"
          # List installed files to debug
          ls -la node_modules/.bin/ | grep bugproof || echo "Bugproof binary not found in .bin"

      - name: Create test environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path smoke-test
          Set-Location smoke-test
          npm init -y
          # Get the actual tarball name
          $Tarball = Get-ChildItem ..\*.tgz | Select-Object -First 1 | ForEach-Object { $_.FullName }
          Write-Host "Installing tarball: $Tarball"
          npm install $Tarball
          # List installed files to debug
          Get-ChildItem node_modules\.bin\ | Where-Object { $_.Name -like "*bugproof*" }

      - name: Verify CLI installation (Unix)
        if: runner.os != 'Windows'
        run: |
          cd smoke-test
          # Try multiple approaches to run the CLI
          echo "Trying npx bugproof..."
          npx bugproof --version || echo "npx failed"
          echo "Trying direct binary..."
          ./node_modules/.bin/bugproof --version || echo "Direct binary failed"
          echo "Trying node with dist/cli.js..."
          node node_modules/bugproof/dist/cli.js --version || echo "Node with dist/cli.js failed"

      - name: Verify CLI installation (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location smoke-test
          # List all files in node_modules/.bin to debug
          Write-Host "Files in node_modules\.bin:"
          Get-ChildItem node_modules\.bin\ | Format-Table Name
          
          # Try multiple approaches to run the CLI
          Write-Host "Trying npx bugproof..."
          npx bugproof --version
          if ($LASTEXITCODE -eq 0) { 
            Write-Host "npx succeeded!"
            exit 0 
          }
          Write-Host "npx failed"
          
          Write-Host "Looking for bugproof files..."
          $bugproofFiles = Get-ChildItem node_modules\.bin\ | Where-Object { $_.Name -like "*bugproof*" }
          if ($bugproofFiles) {
            foreach ($file in $bugproofFiles) {
              Write-Host "Trying $($file.FullName)..."
              & $file.FullName --version
              if ($LASTEXITCODE -eq 0) { 
                Write-Host "$($file.Name) succeeded!"
                exit 0 
              }
            }
          }
          
          Write-Host "Trying node with dist/cli.js..."
          node node_modules\bugproof\dist\cli.js --version
          if ($LASTEXITCODE -eq 0) { 
            Write-Host "node with dist/cli.js succeeded!"
            exit 0 
          }
          
          Write-Host "All methods failed - checking if package was installed..."
          if (Test-Path node_modules\bugproof\package.json) {
            Write-Host "Package installed but CLI not working"
            Get-Content node_modules\bugproof\package.json | Select-String "bin"
          } else {
            Write-Host "Package not installed properly"
          }
          exit 1

  # ========================================
  # Phase 4: Auto Version Bump (main branch only)
  # ========================================
  auto-version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    needs: smoke-install
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies and bump version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          # Bump patch version and create tag
          npm version patch -m "Release v%s [skip ci]"
          # Push changes and tag
          git push origin HEAD:main --force-with-lease
          git push origin --tags

  # ========================================
  # Phase 5: Publish (tags only)
  # ========================================
  publish:
    name: Publish to npm & Create Release
    runs-on: ubuntu-latest
    needs: smoke-install
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️  WARNING: NPM_TOKEN not configured - skipping publish"
            echo "To enable: Settings → Secrets → NPM_TOKEN"
          else
            npm publish --access public
            echo "✅ Published to npmjs.com"
          fi

      - name: Verify package on npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          echo "Waiting for npm registry propagation..."
          sleep 10
          npm view bugproof@${{ env.VERSION }} || echo "Package still propagating"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ env.VERSION }}
          body: |
            ## 📦 BugProof v${{ env.VERSION }}
            
            ### Installation
            ```bash
            # Global install
            npm install -g bugproof
            
            # Local install
            npm install bugproof
            ```
            
            ### What's Changed
            - See [CHANGELOG.md](https://github.com/sidinsearch/BugProof/blob/main/CHANGELOG.md) for details
            
            ### Verification
            - ✅ All tests passed on Ubuntu, Windows, and macOS
            - ✅ Security audit completed
            - ✅ Cross-platform installation verified
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # Phase 6: Post-Publish Verification
  # ========================================
  post-publish-verify:
    name: Verify Published Package
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Wait for registry propagation
        run: sleep 30

      - name: Install published package globally
        run: |
          npm install -g bugproof || echo "Global install failed - package still propagating"

      - name: Verify installation
        run: |
          bugproof --version || echo "Version check failed"
          bugproof --help || echo "Help check failed"

      - name: Test basic functionality
        run: |
          mkdir -p test-verify
          cd test-verify
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test" > test.txt
          git add .
          git commit -m "initial commit"
          bugproof capture --skip-secrets -n test-artifact -- echo "Test execution" || echo "Capture test failed"

      - name: Report success
        if: success()
        run: echo "✅ Post-publish verification passed - Package is ready!"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Post-publish verification failed"
          echo "This may be due to npm registry propagation delays"
          exit 1
