name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - 'dummy-project/bugs/**'
      - 'assets/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - 'dummy-project/bugs/**'
      - 'assets/**'

# Ensure permissions are explicitly granted for GitHub Packages and Releases
permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

  publish:
    name: Publish Release
    needs: validate
    # Only run the publish job when a tag matching 'v*' is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Publish to npmjs (Public)
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to GitHub Packages
        run: |
          # Scope the package name for GitHub Packages compatibility
          sed -i 's/"name": "bugproof"/"name": "@sidinsearch\/bugproof"/' package.json
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## 📦 Published to:
            
            - **npmjs.com** (Public)
              ```bash
              npm install -g bugproof
              npm install bugproof
              ```
            
            - **GitHub Packages** (GitHub-hosted)
              ```bash
              npm install -g @sidinsearch/bugproof --registry https://npm.pkg.github.com
              npm install @sidinsearch/bugproof --registry https://npm.pkg.github.com
              ```
            
            See [CHANGELOG](./CHANGELOG.md) for release details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}