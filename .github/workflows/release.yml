name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Set to true to publish from main (manual run)'
        required: false
        default: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  test-matrix:
    name: Test matrix (OS x Node)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage

  security-audit:
    name: Security audit & pack
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true

      - name: Create package tarball
        run: |
          npm pack
        id: pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'

  smoke-install:
    name: Smoke install + basic CLI sanity
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Smoke install in temp dir
        run: |
          mkdir smoke-test && cd smoke-test
          npm init -y
          npm install ../*.tgz
          npx bugproof --version

  publish:
    name: Publish to registries
    runs-on: ubuntu-latest
    needs: [smoke-install]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Ensure NPM token is present
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then echo "NPM_TOKEN secret is not set"; exit 1; fi

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine version
        id: ver
        run: echo "VERSION=$(node -e \"console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)\")" >> $GITHUB_ENV

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-and-tag:
    name: Auto bump version and tag (on main)
    runs-on: ubuntu-latest
    needs: smoke-install
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and bump version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm version patch -m "Release v%s [skip ci]"
          git push origin HEAD:main --force-with-lease
          git push origin --tags

