name: Publish to npm and GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Run linter
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      # Step 1: Publish to npmjs.com (public registry)
      - name: Publish to npmjs
        run: |
          npm config set registry https://registry.npmjs.org/
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # Step 2: Publish to GitHub Packages (GitHub-hosted registry)
      - name: Publish to GitHub Packages
        run: |
          npm config set @sidinsearch:registry=https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 3: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## 📦 Published to:
            
            - **npmjs.com** (Public)
              ```bash
              npm install -g bugproof
              npm install bugproof
              ```
            
            - **GitHub Packages** (GitHub-hosted)
              ```bash
              npm install -g @sidinsearch/bugproof --registry https://npm.pkg.github.com
              npm install @sidinsearch/bugproof --registry https://npm.pkg.github.com
              ```
            
            See [CHANGELOG](./CHANGELOG.md) for release details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
